# Mémoire allouée à la JVM Gradle.
#
# Le template Flutter par défaut met `-Xmx8G -XX:MaxMetaspaceSize=4G`, ce qui
# suppose une machine de développement haut de gamme. Sur un poste à mémoire
# limitée (ici ~6 Go), la JVM réserve plus que la RAM + fichier d'échange
# disponibles et meurt sur `os::commit_memory failed` / `Out of memory`.
#
# Ce projet est petit : 2 Go de tas suffisent largement, quel que soit le poste.
# Un poste puissant ne s'en trouve pas pénalisé (c'est un plafond, pas une
# réservation).
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m

# Pas de démon Gradle persistant : un JVM Gradle qui traîne en arrière-plan
# monopolise plusieurs centaines de Mo entre deux builds.
org.gradle.daemon=false

# Un seul build à la fois, et pas de compilation parallèle : chaque worker
# supplémentaire est un processus de plus à loger en mémoire.
org.gradle.parallel=false
org.gradle.workers.max=2

# Réutilise les sorties déjà compilées (compense un peu l'absence de démon).
org.gradle.caching=true

# Le compilateur Kotlin tourne dans son propre démon : on le plafonne aussi.
kotlin.daemon.jvmargs=-Xmx512m

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
